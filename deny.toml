[graph]
all-features = false

[advisories]
version = 2
ignore = [
    # zbus 5 still depends on these; their code moved into zbus 6, which we have not migrated to yet.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; folded into zbus 6, no fix for zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; folded into zbus 6, no fix for zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; folded into zbus 6, no fix for zbus 5" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
