name: Release

# A release is a `vN` tag on main (scripts/release.sh). This turns the tag into a
# GitHub Release: a source bundle and SHA256SUMS. There are no prebuilt binaries;
# vinoOpenEffects installs from source (docs/install.md). CI has already run on
# the commit, so this only checks the tag is well-formed and builds the bundle.

on:
  push:
    tags:
      - "v[0-9]+"

# The write token never shares a runner with anything that runs repo code.
permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and has a changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          awk -v t="[$TAG]" '$0 ~ "^## " { on = index($0, "## " t) == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## [$TAG]' section"; exit 1; }

      # Not GitHub's own tag tarballs: they aren't in SHA256SUMS and their bytes
      # have changed before. VERSION is what a bundle's build reports instead of `dev`.
      - name: Build the source bundle and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="vinoopeneffects-$TAG/" \
            --add-virtual-file="vinoopeneffects-$TAG/VERSION:$TAG" \
            -o "dist/vinoopeneffects-$TAG-source.tar.gz" HEAD
          (cd dist && sha256sum -- * > SHA256SUMS)
          cp notes.md dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: bundle
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          prerelease: false
