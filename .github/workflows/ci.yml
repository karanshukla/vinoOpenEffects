name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - &apt
        name: Install system dependencies
        timeout-minutes: 15
        uses: ./.github/actions/apt-deps
      - &cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *apt
      - *cache
      - name: Install a headless X server for the GUI widget tests
        run: sudo apt-get install -y --no-install-recommends xvfb xauth
      - run: xvfb-run -a cargo test --workspace
        env:
          VINOOPENEFFECTS_REQUIRE_DISPLAY: "1"

  core:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *cache
      - name: Check crate boundaries
        run: |
          if cargo tree -p vinoopeneffects-core -e normal --prefix none \
              | grep -E "^(gstreamer|gtk4|libadwaita|pipewire)"; then
            echo "core must not link a media or GUI stack"; exit 1
          fi
          for client in vinoopeneffects vinoopeneffects-ctl; do
            if cargo tree -p "$client" -e normal --prefix none \
                | grep -E "^vinoopeneffects-(core|daemon) "; then
              echo "$client must depend on shared only, not core or daemon"; exit 1
            fi
          done
      - run: cargo test -p vinoopeneffects-core

  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # bench.rs is the --bench-video harness, not product code.
      COV_IGNORE: --ignore-filename-regex daemon/src/bench\.rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - *apt
      - *cache
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Install a headless X server for the GUI widget tests
        run: sudo apt-get install -y --no-install-recommends xvfb xauth
      - run: xvfb-run -a cargo llvm-cov --workspace --no-report
        env:
          VINOOPENEFFECTS_REQUIRE_DISPLAY: "1"
      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only $COV_IGNORE
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo llvm-cov report --lcov --output-path lcov.info $COV_IGNORE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          fail-on-error: false
      - name: Enforce minimum line coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 40 $COV_IGNORE

  build-npu:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *apt
      - *cache
      - run: cargo check -p vinoopeneffects-daemon
      - run: cargo check -p vinoopeneffects-daemon --no-default-features

  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-version in Cargo.toml.
      - run: rustup toolchain install 1.92 --profile minimal
      - *apt
      - *cache
      # Builds the tests too, so a newer API used only in tests or a dev-dependency fails here.
      - run: cargo +1.92 test --workspace --no-run

  install:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *apt
      - *cache
      - run: shellcheck scripts/*.sh
      - name: Refuse a prefix the user can't write, before building
        run: |
          if out="$(scripts/install.sh --prefix /usr/vinoopeneffects-ci --no-models 2>&1)"; then
            echo "install.sh accepted an unwritable prefix"; exit 1
          fi
          echo "$out"
          grep -q "is not writable" <<<"$out"
          ! grep -q "Building" <<<"$out"
      - name: Install ovfetch
        run: cargo install ovfetch --version "$(sed -n 's/^ovfetch_min=//p' scripts/install.sh)" --locked
      - name: Install into a scratch prefix, then remove it
        run: |
          prefix="$RUNNER_TEMP/prefix"
          scripts/install.sh --prefix "$prefix" --no-models
          id=io.github.karanshukla.vinoopeneffects
          for f in bin/vinoopeneffects-daemon bin/vinoopeneffects-ctl bin/vinoopeneffects \
              share/dbus-1/services/$id.Daemon.service \
              share/dbus-1/interfaces/$id.Daemon1.xml \
              share/systemd/user/vinoopeneffects-daemon.service \
              share/applications/$id.desktop \
              share/icons/hicolor/scalable/apps/$id.svg; do
            test -e "$prefix/$f" || { echo "missing: $f"; exit 1; }
          done
          grep -qx "Exec=$prefix/bin/vinoopeneffects-daemon" "$prefix/share/dbus-1/services/$id.Daemon.service"
          # An upgrade over the same prefix keeps or reinstalls onnxruntime and must succeed.
          scripts/install.sh --prefix "$prefix" --no-models
          test -x "$prefix/bin/vinoopeneffects-daemon"
          scripts/uninstall.sh --prefix "$prefix"
          leftover="$(find "$prefix" -type f)"
          test -z "$leftover" || { echo "left behind:"; echo "$leftover"; exit 1; }

  release-bundle:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - *cache
      # Same archive command as release.yml, with a made-up tag; the bundle has no .git.
      - name: Build the CLI from a source bundle and check it reports the tag
        env:
          TAG: v9999
        run: |
          git archive --format=tar.gz --prefix="vinoopeneffects-$TAG/" \
            --add-virtual-file="vinoopeneffects-$TAG/VERSION:$TAG" \
            -o "$RUNNER_TEMP/bundle.tar.gz" HEAD
          tar -xzf "$RUNNER_TEMP/bundle.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/vinoopeneffects-$TAG"
          test ! -e .git
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked -p vinoopeneffects-ctl
          out="$("$GITHUB_WORKSPACE/target/debug/vinoopeneffects-ctl" --version)"
          echo "$out"
          grep -qw "$TAG" <<<"$out"

  deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  fedora:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: fedora:latest
    steps:
      - name: Install toolchain and dev libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo gcc pkgconf-pkg-config clang-devel git \
            gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-bad-free-devel \
            gtk4-devel libadwaita-devel pipewire-devel \
            gstreamer1-plugins-base gstreamer1-plugins-good
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: rustc --version
      - name: Fetch crates (retry on registry network errors)
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch --locked && exit 0
            sleep $((i * 15))
          done
          exit 1
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
