# git-cliff configuration; generates CHANGELOG.md from conventional commits.
# Usage: see docs/development.md#changelog.

[changelog]
header = """
# Changelog

All notable changes to vinoOpenEffects are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Releases are numbered consecutively (v1, v2, ...). Generated by
[git-cliff](https://git-cliff.org) from conventional commits.

"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = ' +\n', replace = "\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
# Every v tag is a boundary, so --unreleased starts after the last one (inherited v0.1.x included).
tag_pattern = "^v[0-9]"
sort_commits = "newest"
filter_commits = true
# The website/ tree left with upstream; its commits are not part of this project.
exclude_paths = ["website/**"]

# A commit takes the first matching parser, so the skips come before the groups.
commit_parsers = [
  { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
  { message = "^chore: release v", skip = true },
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^(build|chore)\\(deps\\)", skip = true },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  { message = "^refactor", group = "<!-- 04 -->Refactor" },
  { message = "^revert", group = "<!-- 05 -->Reverted" },
  { message = "^docs", group = "<!-- 06 -->Documentation" },
  { message = "^test", group = "<!-- 07 -->Tests" },
  { message = "^style", group = "<!-- 08 -->Styling" },
  { message = "^ci", group = "<!-- 09 -->CI" },
  { message = "^build", group = "<!-- 10 -->Build" },
  { message = "^chore", group = "<!-- 11 -->Miscellaneous" },
]

[remote.github]
owner = "karanshukla"
repo = "vinoOpenEffects"
