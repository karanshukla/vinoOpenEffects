[model]
id = "palm_detection"
name = "MediaPipe Palm Detection"
version = "2023feb"
license = "Apache-2.0"

[model.input]
name = "input_1"
shape = [1, 192, 192, 3]
layout = "NHWC"
preprocessing = "scale_0_1"

[model.output.regressors]
name = "Identity"
shape = [1, 2016, 18]
postprocessing = "ssd_decode"

[model.output.scores]
name = "Identity_1"
shape = [1, 2016, 1]
postprocessing = "sigmoid"

[model.execution]
supported_eps = ["cpu", "cuda", "tensorrt", "openvino"]
min_vram_mb = 0

[[model.variants]]
name = "fp32"
file = "palm_detection_mediapipe_2023feb.onnx"
sha256 = "78ff51c38496b7fc8b8ebdb6cc8c1abb02fa6c38427c6848254cdaba57fcce7c"

[model.source]
url = "https://github.com/opencv/opencv_zoo/raw/main/models/palm_detection_mediapipe/palm_detection_mediapipe_2023feb.onnx"
