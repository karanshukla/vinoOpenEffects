[model]
id = "hand_landmark"
name = "MediaPipe Hand Landmark"
version = "2023feb"
license = "Apache-2.0"

[model.input]
name = "input_1"
shape = [1, 224, 224, 3]
layout = "NHWC"
preprocessing = "scale_0_1"

[model.output.landmarks]
name = "Identity"
shape = [1, 63]
postprocessing = "none"

[model.output.confidence]
name = "Identity_1"
shape = [1, 1]
postprocessing = "sigmoid"

[model.output.handedness]
name = "Identity_2"
shape = [1, 1]
postprocessing = "none"

[model.output.world_landmarks]
